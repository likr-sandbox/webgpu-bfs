[package]
name = "webgpu-bfs-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings and browser WebGPU MS-BFS engine for webgpu-bfs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Workspace crates
webgpu-bfs-core = { workspace = true }
webgpu-bfs-cpu = { workspace = true }
webgpu-bfs-shaders = { workspace = true }
webgpu-bfs-gpu = { workspace = true }

# WASM bindings & browser APIs
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }

# Logging and error reporting
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
log = { workspace = true }

# Utilities & serialization
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }
bytemuck = { workspace = true }
futures-channel = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
pollster = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
